<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wolfpack TOI</title>
<style>
  :root {
    --bg: #0b0e10;
    --panel: #131a1f;
    --line: #243038;
    --fg: #d8e6ee;
    --dim: #6b8290;
    --amber: #ffb24a;
    --red: #ff5555;
    --green: #4ade80;
  }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
    height: 100%;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 40px 20px;
    text-align: center;
  }
  h1 {
    margin: 0 0 4px 0;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--dim);
    font-weight: normal;
  }
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 24px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
  }
  .dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 28px 20px;
    margin-bottom: 16px;
  }
  .label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 10px;
  }
  .big {
    font-size: 64px;
    font-variant-numeric: tabular-nums;
    line-height: 1.0;
    color: var(--fg);
    letter-spacing: 1px;
  }
  .big.huge {
    font-size: 84px;
  }
  .big.amber { color: var(--amber); }
  .meta {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 13px;
  }
  .meta .label { margin-bottom: 2px; }
  .meta .v { color: var(--fg); font-variant-numeric: tabular-nums; }
  input[type=text] {
    width: 100%;
    box-sizing: border-box;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 3px;
    font-family: inherit;
    font-size: 26px;
    padding: 12px 14px;
    text-align: center;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--amber); }
  .hint { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .countdown.reached { color: var(--green) !important; }
  .countdown.passed { color: var(--red) !important; }
  .stale .big { color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Wolfpack TOI</h1>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="conn">connecting…</span>
  </div>

  <div class="panel" id="nowPanel">
    <div class="label">In-game time</div>
    <div class="big" id="now">--:--:--</div>
    <div class="meta">
      <div><div class="label">Date</div><div class="v" id="date">—</div></div>
      <div><div class="label">Vessel</div><div class="v" id="vessel">—</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="label">Time of impact (HH:MM or HH:MM:SS)</div>
    <input type="text" id="toi" placeholder="14:30:00" autocomplete="off" spellcheck="false">
  </div>

  <div class="panel" id="cdPanel">
    <div class="label">Time to impact</div>
    <div class="big huge amber countdown" id="cd">--:--:--</div>
  </div>
</div>

<script>
"use strict";
const ENDPOINT = "http://127.0.0.1:1941/time";
const POLL_MS = 250;
const STALE_MS = 3000;

const $ = id => document.getElementById(id);
const dot = $("dot"), conn = $("conn"), nowPanel = $("nowPanel");
const nowEl = $("now"), dateEl = $("date"), vesselEl = $("vessel");
const toiInput = $("toi"), cdEl = $("cd"), cdPanel = $("cdPanel");

let lastOk = 0;
let last = null; // last successful payload

toiInput.value = localStorage.getItem("toi") || "";
toiInput.addEventListener("input", () => {
  localStorage.setItem("toi", toiInput.value);
  render();
});

function parseHMS(s) {
  if (!s) return null;
  const parts = s.trim().split(":").map(p => p.trim());
  if (parts.length < 2 || parts.length > 3) return null;
  const h = +parts[0], m = +parts[1], sec = parts.length === 3 ? +parts[2] : 0;
  if (![h, m, sec].every(Number.isFinite)) return null;
  if (h < 0 || h > 23 || m < 0 || m > 59 || sec < 0 || sec > 59) return null;
  return h * 3600 + m * 60 + sec;
}

function fmtHMS(totalSec) {
  totalSec = Math.max(0, Math.floor(totalSec));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, "0");
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}

async function poll() {
  try {
    const r = await fetch(ENDPOINT, { cache: "no-store" });
    if (!r.ok) throw new Error("status " + r.status);
    last = await r.json();
    lastOk = Date.now();
  } catch (e) {
    // keep last value but mark stale
  }
  render();
}

function render() {
  const stale = Date.now() - lastOk > STALE_MS;
  const ok = !!last && !stale;

  dot.classList.toggle("ok", ok);
  conn.textContent = ok
    ? (last.missionActive ? "connected · mission active" : "connected · idle")
    : (last ? "stale" : "disconnected");
  nowPanel.classList.toggle("stale", !ok);

  if (last) {
    nowEl.textContent = last.time || "--:--:--";
    dateEl.textContent = last.date || "—";
    vesselEl.textContent = last.vessel || "—";
  }

  cdEl.classList.remove("reached", "passed");
  const toiSec = parseHMS(toiInput.value);
  const nowSec = last ? parseHMS(last.time) : null;
  if (toiSec == null || nowSec == null) {
    cdEl.textContent = "--:--:--";
    return;
  }
  let diff = toiSec - nowSec;
  if (diff < 0) diff += 86400; // wrap to next day
  if (diff === 0) { cdEl.classList.add("reached"); cdEl.textContent = "00:00:00"; return; }
  // Highlight green when within 60s, default amber otherwise
  if (diff <= 60) cdEl.classList.add("reached");
  cdEl.textContent = fmtHMS(diff);
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
