## Settings file was created by plugin AlliedUboat v1.6.3
## Plugin GUID: AlliedUboat

[AlliedUboat]

## Master toggle. When enabled and this client is the host, the configured U-boat becomes undetectable by all AI convoy detection channels.
# Setting type: Boolean
# Default value: false
Enabled = true

## U-boat name to make undetectable (the allied sub). Matched after trimming, upper-casing and stripping non-alphanumerics, so '307', 'u-307' and 'U307' all work.
# Setting type: String
# Default value: 307
AlliedUboat = 307

## One-shot: when the host's convoy has spawned, place the allied sub just outside the escort ring (direction from convoy toward the sub's spawn point, preserving depth and heading). If no escort position is readable yet (convoy still spawning), place it ConvoySpawnMargin m from the nearest merchant instead. One-time per sub.
# Setting type: Boolean
# Default value: true
SpawnNearConvoy = true

## Extra distance (m) beyond the outermost escort when placing the allied sub.
# Setting type: Single
# Default value: 1000
ConvoySpawnMargin = 1000

## If the allied sub's torpedo hits a convoy ship or escort, its allied status is revoked immediately — it becomes a normal, detectable enemy for the rest of the mission. Since 1.4.2 a deck-gun shell by the allied sub that hits a convoy ship hull (escort AI_Escort/NavEscort/EscortAI or merchant W_Cargoship/AI_Merchant) revokes the same way; hits on enemy U-boat hulls or unclassifiable targets keep protection.
# Setting type: Boolean
# Default value: true
BecomeEnemyOnFriendlyFire = true

## When true, torpedo damage is applied between the allied sub and Axis subs both ways (the allied sub's torpedoes damage Axis subs, and Axis subs' torpedoes damage the allied sub). Since 1.4.6 the same override covers deck-gun hits and hull collisions (rams) between the allied sub and Axis subs. Axis-vs-Axis stays a friendly-fire dud (premature explosion, no damage). False = current behavior (all U-boat hits are duds).
# Setting type: Boolean
# Default value: true
OverrideFriendlyFireFromAlliedSub = true

## How many deck-gun shell hits from the allied sub it takes to sink an Axis sub (and vice versa). The per-hit damage is scaled so exactly this many hits kill a full-health sub. 1 = one-shot (the pre-1.5.1 behavior). Escort deck-gun damage is untouched.
# Setting type: Int32
# Default value: 3
DeckgunHitsToKill = 3

## When true, the convoy is never alerted by the allied sub's weapons: its deck-gun fire (including the water splash) and its torpedoes (sighting and noise) do not alert or panic the convoy. Axis subs' torpedoes and deck guns still alert the convoy normally.
# Setting type: Boolean
# Default value: true
BlockConvoyAlertFromAlliedSub = true

## After the allied sub fires its deck gun, the convoy's gun-running detection arms and escorts can stay stuck in a long search loop. While this window (seconds) is active, all three de-alert tickers run their full write set on EVERY escort, not just those holding an allied-sub contact. 0 disables the window.
# Setting type: Int32
# Default value: 240
GunFireDealertSeconds = 240

## When true, the one-shot placement puts the allied sub in the convoy's formation slot — 35% of the way from the front escort (the escort farthest along the convoy's direction of travel) toward the merchant centroid, i.e. behind the front escort and ahead of the merchant column. Falls back to the outside-ring/merchant placement when the formation can't be computed (convoy direction unknown, or positions not readable yet).
# Setting type: Boolean
# Default value: true
SpawnInFormation = true

## Neutralize NavTarget.fireDeckgun() (the gun-running detection channel) when called on the allied sub's NavTarget — its fireDeckGunBonus is zeroed immediately after the call, so deck-gun fire by the allied sub never arms convoy gun-running detection.
# Setting type: Boolean
# Default value: true
BlockGunRunDetection = true

## When true, escorts holding a live contact on a non-allied sub (e.g. a real Axis sub) are left alone by both the deckgun de-alert window and the stuck-search demotion. Set false to restore 1.3.0 blanket de-alert behavior.
# Setting type: Boolean
# Default value: true
SpareRealContacts = true

## AA gun fires a flare at the aim point and the closest escort moves to it
# Setting type: Boolean
# Default value: true
FlareGun = true

## Flare landing distance from the sub in meters
# Setting type: Single
# Default value: 1500
FlareRange = 1500

## Seconds the escort holds position at the flare
# Setting type: Single
# Default value: 30
FlareHoldSeconds = 30

## AA gun cooldown after firing a flare (seconds)
# Setting type: Single
# Default value: 600
FlareCooldownSeconds = 600

## Minimum flare landing distance from the sub in meters — keeps a steep air-target AA shot from aiming the escort on a crash course into the sub
# Setting type: Single
# Default value: 300
FlareMinimumRange = 300

